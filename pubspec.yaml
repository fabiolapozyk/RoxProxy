name: rox_proxy
description: "RoxProxy — HTTP/HTTPS intercepting proxy for macOS."
publish_to: 'none'

version: 0.2.1+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Local native plugin (Swift bridge)
  rox_proxy_native:
    path: packages/rox_proxy_native

  # State management (Fase 2: sostituire con Provider per ulteriori semplificazioni)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # File selection dialog for Map Local file paths and import/export
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
